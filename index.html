<body>

<!-- 内联 SVG 图标精灵（加载成功前隐藏，避免出现空占位块） -->
<div id="icon-sprite" style="display:none" aria-hidden="true"></div>

<!-- 应用挂载点 -->
<div id="app">
  <noscript>
    <div style="padding:40px;font-family:sans-serif">
      <h1>需要启用 JavaScript</h1>
      <p>本站为单页应用，请启用 JavaScript 后刷新页面。</p>
    </div>
  </noscript>
</div>

<!-- ========== 基础工具 ========== -->

<!-- ========== 启动 ========== -->
<script src="js/app.js?v=20261122a"></script>

<script>
/* 注入 SVG 图标精灵 */
(function () {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "assets/icons.svg", true);
  xhr.onload = function () {
    if (xhr.status === 200 || xhr.status === 0) {
      var host = document.getElementById("icon-sprite");
      /* 整份替换（含 <svg> 外壳）：innerHTML 剥壳会让 symbol 落入 HTML 命名空间而全站图标隐形 */
      host.outerHTML = xhr.responseText;
    }
  };
  xhr.onerror = function () { /* 图标缺失不影响功能 */ };
  try { xhr.send(); } catch (e) { /* ignore */ }
})();
</script>
</body>
